version: 2
jobs:
  build:
    working_directory: /tmp/repository
    docker:
      - image: ros:kinetic-ros-core

    steps:
        - checkout:
            path: ~/parsian_ws/src/ssl
        - run:
            name: Set Up Container
            command: |
              echo "Start Deps"
              apt-get update && apt-get install --assume-yes python-catkin-tools build-essential libqt4-dev libqjson-dev protobuf-compiler libprotobuf-dev libeigen3-dev curl > /dev/null
              MAHI=`pwd`
              ls -a
              echo "Done Deps"
              source /opt/ros/kinetic/setup.bash
              rosdep install --from-paths . --ignore-src -y
              cd ..
              catkin init
              catkin config --extend /opt/ros/$ROS_DISTRO
        - run:
            name: Build
            command: |
              cd ..
              catkin build
        - run:
            name: Run Tests
            command: |
              cd ..
              catkin run_tests

        - store_test_results:
            path: test_results

        - store_artifacts:
            path: code_coverage_results


# Two main workflows: One run per commit, one to run master nightly.
workflows:
  version: 2
  commit-workflow:
    jobs:
      - build
  nightly-workflow:
    triggers:
      - schedule:
          cron: "0 1 * * *"
          filters:
            branches:
              only: develop
    jobs:
      - build
